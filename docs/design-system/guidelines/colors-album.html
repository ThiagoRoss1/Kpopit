<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-display);color:var(--text);background:var(--surface-page)}*{box-sizing:border-box}.w{padding:20px 24px}.sw{display:flex;gap:12px;flex-wrap:wrap}.s{width:96px}.chip{height:56px;border-radius:12px;border:2px solid var(--ink);box-shadow:var(--offset-sm)}.n{font-size:12px;font-weight:700;margin-top:6px}.v{font-size:11px;color:var(--text-muted)}.ramp{display:flex;margin:20px 24px;height:64px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:var(--offset-lg)}.ramp div{flex:1;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700;color:#fff}</style></head><body data-style="retro"><div class="ramp"><div style="background:var(--album-deep)">deep</div><div style="background:var(--album-secondary)">secondary</div><div style="background:var(--album-main)">main</div><div style="background:var(--album-accent)">accent</div><div style="background:var(--album-light)">light</div></div></body></html>
