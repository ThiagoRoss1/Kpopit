<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-display);color:var(--text);background:var(--surface-page)}*{box-sizing:border-box}.w{padding:20px 24px}.sw{display:flex;gap:12px;flex-wrap:wrap}.s{width:96px}.chip{height:56px;border-radius:12px;border:2px solid var(--ink);box-shadow:var(--offset-sm)}.n{font-size:12px;font-weight:700;margin-top:6px}.v{font-size:11px;color:var(--text-muted)}.r{display:flex;gap:22px;padding:22px 24px}.r div{width:100px;height:80px;border-radius:14px;background:#fff;border:2px solid var(--ink);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:700}</style></head><body data-style="retro"><div class="r"><div style="box-shadow:var(--offset-sm)">offset-sm 2</div><div style="box-shadow:var(--offset-md)">offset-md 3</div><div style="box-shadow:var(--offset-lg)">offset-lg 4</div><div style="box-shadow:var(--offset-xl)">offset-xl 6</div><div style="box-shadow:var(--press);border-radius:999px;height:44px;align-self:center;justify-content:center;padding:0">press 0/4</div></div></body></html>
